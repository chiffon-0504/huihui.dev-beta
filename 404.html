<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | huihui.dev</title>
  <link rel="stylesheet" href="/style.css">
  <style>
  .error-home-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin-top: 2rem;
    padding: 1rem 2.5rem;

    border-radius: 999px;
    background: rgba(255, 255, 255, 0.65);
    color: #1f2937;
    text-decoration: none;

    font-size: 1.5rem;
    font-weight: 700;

    box-shadow: 0 18px 45px rgba(80, 120, 160, 0.18);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .error-home-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 24px 55px rgba(80, 120, 160, 0.25);
  }
</style>
</head>
<body>
  <main style="padding: 4rem;">
    <h1>404</h1>
    <p>這個頁面不存在。</p>
    <p>This page does not exist.</p>
    <p>このページは存在しません。</p>
    <a class="error-home-button" href="/">回首頁 / Home / ホーム</a>
  </main>
</body>
</html>
