<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero fade-in">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4 data-i18n="home.hero.subtitle"></h4>
        <div class="hero-actions">
          <a href="/en/about/" class="hero-btn" data-i18n="home.hero.about"></a>
          <a href="/en/contact/" class="hero-btn" data-i18n="home.hero.contact"></a>
        </div>
      </div>

      <article class="project-update-card" aria-labelledby="projectUpdateTitle">
        <p class="project-update-label" data-i18n="home.projectUpdate.label"></p>
        <h2 id="projectUpdateTitle" data-i18n="home.projectUpdate.title"></h2>
        <p class="project-update-desc" data-i18n="home.projectUpdate.desc"></p>
      </article>
    </section>

    <section class="daily-inspiration-section website-version-section fade-in fade-in-delay-2" aria-labelledby="websiteVersionTitle">
      <article class="apod-card">
        <div class="apod-content">
          <p class="apod-label">Website Version</p>
          <div class="version-heading">
            <h2 id="websiteVersionTitle">v1.1.1</h2>
            <span class="version-badge">Stable release</span>
          </div>

          <div class="apod-date release-notes">
            <p>Release notes:</p>
            <ul>
              <li>Adjusted homepage glass card transparency</li>
              <li>Adjusted sidebar glass background transparency</li>
              <li>Improved homepage card and button hover states</li>
              <li>Refined background gradient depth</li>
            </ul>
          </div>
        </div>
      </article>
    </section>

    <section class="tech-news-section fade-in fade-in-delay-1" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle" data-i18n="home.tech.title"></h2>
        <p data-i18n="home.tech.desc"></p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">Loading updates...</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Preview" />
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/locales/zh.js"></script>
  <script src="/js/locales/en.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>

</body>
</html>
