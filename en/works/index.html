<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/style.css" />

  <title>Works | huihui.dev</title>
</head>

<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <h1>Works</h1>

    <section class="hero" id="home">
      <img src="/images/2001_w.webp" alt="Mount Fuji" class="zoomable" />
    </section>

    <section id="works">
      <div class="works-grid">
        <article class="work-card large">
          <img src="/images/2002_w.webp" alt="Tsutenkaku" class="zoomable" />
        </article>

        <article class="work-card tall">
          <img src="/images/2003_w.webp" alt="Yokohama Port" class="zoomable" />
        </article>

        <article class="work-card small">
          <img src="/images/2004_w.webp" alt="Train" class="zoomable" />
        </article>

        <article class="work-card small">
          <img src="/images/2005_w.webp" alt="Deer" class="zoomable" />
        </article>

        <article class="work-card small">
          <img src="/images/2006_w.webp" alt="Penguin" class="zoomable" />
        </article>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Preview" />
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/lightbox.js"></script>
</body>
</html>
