<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/style.css" />

  <title>Works | huihui.dev</title>
  <link rel="canonical" href="https://huihui.dev/en/works/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://huihui.dev/works/" />
  <link rel="alternate" hreflang="en" href="https://huihui.dev/en/works/" />
  <link rel="alternate" hreflang="ja" href="https://huihui.dev/ja/works/" />
  <link rel="alternate" hreflang="x-default" href="https://huihui.dev/works/" />
</head>

<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell works-page works-showcase-page">
      <header class="works-hero works-showcase-hero">
        <h1 data-i18n="works.title"></h1>
        <p class="works-lead" data-i18n="works.lead"></p>
      </header>

      <section class="works-showcase-grid" aria-label="Works showcase">
        <article class="showcase-card showcase-card-large showcase-project-card" aria-label="huihui.dev project">
          <img
            src="/images/2001_w.webp"
            srcset="/images/2001_w-900.webp 900w, /images/2001_w-1600.webp 1600w, /images/2001_w-2400.webp 2400w"
            sizes="(max-width: 722px) 680px, (max-width: 900px) calc(100vw - 42px), 1074px"
            data-full-src="/images/2001_w.webp"
            width="3024"
            height="1859"
            decoding="async"
            data-i18n-alt="works.images.fuji"
            class="zoomable"
          />
          <a class="showcase-card-info" href="/en/" aria-label="huihui.dev project">
            <span class="showcase-type" data-i18n="works.cards.website.type"></span>
            <h2 data-i18n="works.cards.website.title"></h2>
            <p data-i18n="works.cards.website.desc"></p>
            <span class="showcase-tag" data-i18n="works.cards.website.tag"></span>
          </a>
        </article>

        <a class="showcase-card showcase-project-card showcase-text-card showcase-tier-card" href="/en/tools/tier-maker/" aria-label="Tier Maker tool">
          <div class="showcase-card-info static-info">
            <span class="showcase-type" data-i18n="works.cards.tierMaker.type"></span>
            <h2 data-i18n="works.cards.tierMaker.title"></h2>
            <p data-i18n="works.cards.tierMaker.desc"></p>
            <span class="showcase-tag" data-i18n="works.cards.tierMaker.tag"></span>
          </div>
        </a>

        <article class="showcase-card showcase-project-card showcase-text-card showcase-workers-card">
          <div class="showcase-card-info static-info">
            <span class="showcase-type" data-i18n="works.cards.workers.type"></span>
            <h2 data-i18n="works.cards.workers.title"></h2>
            <p data-i18n="works.cards.workers.desc"></p>
            <span class="showcase-tag" data-i18n="works.cards.workers.tag"></span>
          </div>
        </article>

        <article class="showcase-card showcase-photo-card showcase-card-wide">
          <img
            src="/images/2002_w.webp"
            srcset="/images/2002_w-900.webp 900w, /images/2002_w-1600.webp 1600w, /images/2002_w-1800.webp 1800w"
            sizes="(max-width: 900px) calc(100vw - 42px), (max-width: 942px) 383px, (max-width: 1200px) calc(66.667vw - 245px), min(660px, calc(66.667vw - 298px))"
            data-full-src="/images/2002_w.webp"
            width="3024"
            height="3078"
            loading="lazy"
            decoding="async"
            data-i18n-alt="works.images.tsutenkaku"
            class="zoomable"
          />
          <div class="showcase-photo-label" data-i18n="works.cards.photography"></div>
        </article>

        <article class="showcase-card showcase-photo-card showcase-card-tall">
          <img
            src="/images/2003_w.webp"
            srcset="/images/2003_w-900.webp 900w, /images/2003_w-1600.webp 1600w, /images/2003_w-2400.webp 2400w"
            sizes="(max-width: 526px) 484px, (max-width: 900px) calc(100vw - 42px), 1146px"
            data-full-src="/images/2003_w.webp"
            width="4615"
            height="2660"
            loading="lazy"
            decoding="async"
            data-i18n-alt="works.images.yokohama"
            class="zoomable"
          />
          <div class="showcase-photo-label" data-i18n="works.cards.travel"></div>
        </article>

        <article class="showcase-card showcase-photo-card">
          <img
            src="/images/2004_w.webp"
            srcset="/images/2004_w-900.webp 900w, /images/2004_w-1600.webp 1600w, /images/2004_w-1800.webp 1800w"
            sizes="(max-width: 439px) 397px, (max-width: 900px) calc(100vw - 42px), 554px"
            data-full-src="/images/2004_w.webp"
            width="5043"
            height="3538"
            loading="lazy"
            decoding="async"
            data-i18n-alt="works.images.train"
            class="zoomable"
          />
          <div class="showcase-photo-label" data-i18n="works.cards.train"></div>
        </article>

        <article class="showcase-card showcase-photo-card">
          <img
            src="/images/2005_w.webp"
            width="745"
            height="487"
            loading="lazy"
            decoding="async"
            data-i18n-alt="works.images.deer"
            class="zoomable"
          />
          <div class="showcase-photo-label" data-i18n="works.cards.deer"></div>
        </article>

        <article class="showcase-card showcase-photo-card">
          <img
            src="/images/2006_w.webp"
            width="1105"
            height="1767"
            loading="lazy"
            decoding="async"
            data-i18n-alt="works.images.penguin"
            class="zoomable"
          />
          <div class="showcase-photo-label" data-i18n="works.cards.penguin"></div>
        </article>
      </section>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Image preview">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close preview">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" data-i18n-alt="works.images.preview" />
  </dialog>

  <script src="/js/layout.js"></script>
  <script src="/js/glass-material.js"></script>
  <script src="/js/mobile-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/locales/zh.js"></script>
  <script src="/js/locales/en.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>
</body>
</html>
