<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | huihui.dev</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="contact-page">
      <div class="contact-content">
        <p class="contact-eyebrow">Contact</p>
        <h1>Contact</h1>
        <p class="contact-intro">For questions, collaborations, or feedback, you can reach me through the form below.</p>

        <form id="contact-form" class="contact-form" action="https://api.huihui.dev/api/contact" method="POST"></form>
          <div class="contact-field-grid">
            <label>
              Name
              <input type="text" name="name" placeholder="Your name" autocomplete="name" required>
            </label>

            <label>
              Email
              <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
            </label>
          </div>

          <label>
            Message
            <textarea name="message" rows="7" placeholder="Your message" required></textarea>
          </label>

          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAADGNDJDS7_lhuZCV"
          ></div>

          <button type="submit">Send Message</button>
          <p id="contact-status" class="contact-status" aria-live="polite"></p>
        </form>

        <p class="contact-fallback">
          Or email directly: <a href="mailto:contact@huihui.dev">contact@huihui.dev</a>
        </p>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script>
    const contactForm = document.getElementById("contact-form");
    const contactStatus = document.getElementById("contact-status");

    contactForm?.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = contactForm.querySelector("button[type='submit']");
      submitButton.disabled = true;
      submitButton.textContent = "送出中...";
      contactStatus.textContent = "";

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "送出失敗");
        }

        contactForm.reset();

        if (window.turnstile) {
          window.turnstile.reset();
        }

        contactStatus.textContent = "訊息已送出。";
      } catch (error) {
        contactStatus.textContent = "送出失敗，請稍後再試。";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "送出訊息";
      }
    });
  </script>
</body>
</html>
