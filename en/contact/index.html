<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | huihui.dev</title>
  <link rel="stylesheet" href="/css/contact.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell">
      <div class="contact-page">
        <div class="page-body contact-content">
          <h1 data-i18n="contact.title"></h1>
          <p class="contact-intro" data-i18n="contact.intro"></p>

          <form id="contact-form" class="contact-form" action="https://api.huihui.dev/api/contact" method="POST">
            <div class="contact-field-grid">
              <label>
                <span data-i18n="contact.name"></span>
                <input type="text" name="name" data-i18n-placeholder="contact.namePlaceholder" autocomplete="name" required>
              </label>

              <label>
                <span data-i18n="contact.email"></span>
                <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
              </label>
            </div>

            <label>
              <span data-i18n="contact.message"></span>
              <textarea name="message" rows="7" data-i18n-placeholder="contact.messagePlaceholder" required></textarea>
            </label>

            <div
              class="cf-turnstile"
              data-sitekey="0x4AAAAAADGNDJDS7_lhuZCV"
            ></div>

            <button type="submit" data-i18n="contact.submit"></button>
            <p id="contact-status" class="contact-status" aria-live="polite"></p>
          </form>

          <p class="contact-fallback">
            <span data-i18n="contact.fallbackPrefix"></span> <a href="mailto:contact@huihui.dev">contact@huihui.dev</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/locales/zh.js"></script>
  <script src="/js/locales/en.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    const contactForm = document.getElementById("contact-form");
    const contactStatus = document.getElementById("contact-status");

    function getContactText(key) {
      const locale = getCurrentLocale();
      return window.HUIHUI_I18N?.[locale]?.contact?.[key] || window.HUIHUI_I18N?.zh?.contact?.[key] || "";
    }

    contactForm?.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = contactForm.querySelector("button[type='submit']");
      submitButton.disabled = true;
      submitButton.textContent = getContactText("submitting");
      contactStatus.textContent = "";

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || getContactText("error"));
        }

        contactForm.reset();

        if (window.turnstile) {
          window.turnstile.reset();
        }

        contactStatus.textContent = getContactText("success");
      } catch (error) {
        contactStatus.textContent = getContactText("error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = getContactText("submit");
      }
    });
  </script>
</body>
</html>
