name: Deploy huihui API Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/huihui-api/**"
      - ".github/workflows/deploy-huihui-api-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Worker environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

# Cancel the entire stale beta push workflow before its validation can later
# reach deploy-beta. Manual dispatch is production-only and uses a separate,
# non-canceling concurrency domain.
concurrency:
  group: huihui-api-${{ github.event_name == 'push' && 'beta' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-beta:
    if: github.event_name == 'push'
    uses: ./.github/workflows/validate.yml

  validate-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/main-regression.yml

  deploy-beta:
    if: github.event_name == 'push'
    needs: validate-beta
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy beta Cloudflare Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/huihui-api
          command: deploy --env beta

  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'production' &&
      github.ref == 'refs/heads/main'
    needs: validate-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy production Cloudflare Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/huihui-api
          command: deploy
