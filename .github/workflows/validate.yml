name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static-unit:
    name: Static and unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run static contract tests
        run: npm run test:unit

  chromium-critical:
    name: Chromium critical
    # Reusable workflows inherit the caller event, so also require this workflow's own ref.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.workflow_ref, '/.github/workflows/validate.yml@')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium critical smoke tests
        run: npx playwright test tests/e2e/cross-browser-critical.spec.mjs --project=chromium --workers=1 --retries=0

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-pr-chromium-critical
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
