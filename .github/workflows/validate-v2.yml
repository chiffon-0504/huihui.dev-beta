name: Validate v2 shell

on:
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - "tests/v2/**"
      - "tests/v2-preview/**"
      - "tests/scripts/v2-preview-deployment.mjs"
      - "tests/scripts/v2-preview-server.mjs"
      - "tests/unit/v2-*.test.mjs"
      - "tests/support/csp-enforcement.mjs"
      - "playwright.v2.config.mjs"
      - "playwright.v2-preview.config.mjs"
      - "playwright.base.config.mjs"
      - "vite.v2.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "_headers"
      - ".github/workflows/validate-v2.yml"
      - ".github/workflows/deploy-v2-beta.yml"

permissions:
  contents: read

jobs:
  v2-shell:
    name: TypeScript and v2 browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run v2 unit contracts
        run: npx vitest run tests/unit/v2-
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build and test v2 shell
        run: npm run test:e2e:v2
      - name: Verify built preview with delivered CSP
        env:
          V2_PREVIEW_LOCAL: "1"
        run: npx playwright test --config=playwright.v2-preview.config.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-v2-shell
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
