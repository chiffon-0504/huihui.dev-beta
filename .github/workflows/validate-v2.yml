name: Validate v2 shell

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v2-changes:
    name: Detect v2 changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - name: Checkout PR with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Detect V2-relevant paths
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/scripts/v2-pr-gate.mjs changes

  v2-unit:
    name: v2 unit contracts
    needs: v2-changes
    if: needs.v2-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run v2 unit contracts
        run: npx vitest run tests/unit/v2-

  v2-browsers:
    name: v2 E2E (${{ matrix.browser }})
    needs: v2-changes
    if: needs.v2-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build and test v2 shell
        run: npm run test:e2e:v2 -- --project=${{ matrix.browser }}
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-v2-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  v2-beta:
    name: v2 built-beta and CSP
    needs: v2-changes
    if: needs.v2-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build v2
        run: npm run build:v2
      - name: Verify built beta with delivered CSP
        env:
          V2_BETA_LOCAL: "1"
        run: npx playwright test --config=playwright.v2-beta.config.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-v2-beta
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  v2-shell:
    name: TypeScript and v2 browsers
    needs: [v2-changes, v2-unit, v2-browsers, v2-beta]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require successful V2 validation or verified non-applicability
        env:
          CHANGES_RESULT: ${{ needs.v2-changes.result }}
          V2_REQUIRED: ${{ needs.v2-changes.outputs.required }}
          UNIT_RESULT: ${{ needs.v2-unit.result }}
          BROWSERS_RESULT: ${{ needs.v2-browsers.result }}
          BETA_RESULT: ${{ needs.v2-beta.result }}
        run: node tests/scripts/v2-pr-gate.mjs gate
