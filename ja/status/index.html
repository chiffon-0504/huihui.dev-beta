<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="/style.css" />
  <title>システム状況 | huihui.dev</title>
  <meta name="description" content="huihui.dev の Website、API、Contact Service の現在の稼働状況を確認できます。" />
  <link rel="canonical" href="https://huihui.dev/ja/status/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://huihui.dev/status/" />
  <link rel="alternate" hreflang="en" href="https://huihui.dev/en/status/" />
  <link rel="alternate" hreflang="ja" href="https://huihui.dev/ja/status/" />
  <link rel="alternate" hreflang="x-default" href="https://huihui.dev/status/" />
</head>

<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell system-status-page">
      <header class="system-status-page-header">
        <p class="project-update-label" data-i18n="systemStatus.title">システム状況</p>
        <h1 data-i18n="systemStatus.pageTitle">huihui.dev システム状況</h1>
        <p data-i18n="systemStatus.pageIntro">Website、API、Contact Service の現在のファーストパーティー稼働状況です。</p>
      </header>

      <section class="system-status-detail" role="status" aria-live="polite" aria-atomic="true" data-system-status-surface="detail" data-status="unknown">
        <p class="system-status-overall" data-i18n="systemStatus.checking">システム状況を確認しています……</p>
      </section>
      <section id="systemStatusHistory" class="system-status-history" aria-labelledby="systemStatusHistoryTitle">
        <h2 id="systemStatusHistoryTitle" data-i18n="systemStatus.history.title"></h2>
        <p class="system-status-history-intro" data-i18n="systemStatus.history.intro"></p>
        <p class="system-status-history-message" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="system-status-history-content"></div>
      </section>
      <section id="systemStatusIncidents" class="system-status-incidents" aria-labelledby="systemStatusIncidentsTitle">
        <h2 id="systemStatusIncidentsTitle" data-i18n="systemStatus.incidents.title"></h2>
        <p class="system-status-incidents-intro" data-i18n="systemStatus.incidents.intro"></p>
        <p class="system-status-incidents-message" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="system-status-incidents-content"></div>
      </section>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/home-cards.js"></script>
  <script src="/js/glass-material.js"></script>
  <script src="/js/mobile-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>
</body>
</html>
