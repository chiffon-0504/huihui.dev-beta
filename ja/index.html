<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="/style.css" />
  <title>huihui.dev</title>
  <meta name="description" content="huihui.devは、開発プロジェクト、マイルストーン、個人の興味・関心を紹介する個人サイト兼ポートフォリオです。" />
  <link rel="canonical" href="https://huihui.dev/ja/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://huihui.dev/" />
  <link rel="alternate" hreflang="en" href="https://huihui.dev/en/" />
  <link rel="alternate" hreflang="ja" href="https://huihui.dev/ja/" />
  <link rel="alternate" hreflang="x-default" href="https://huihui.dev/" />
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero fade-in">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <p class="home-subtitle" data-i18n="home.hero.subtitle">Web UI、コードレンダリング、組み込みシステムに焦点を当てた個人開発スペースです。</p>
        <div class="hero-actions">
          <a href="/ja/about/" class="hero-btn" data-i18n="home.hero.about"></a>
          <a href="/ja/contact/" class="hero-btn" data-i18n="home.hero.contact"></a>
        </div>
      </div>

      <article class="project-update-card system-status-card" aria-labelledby="systemStatusTitle">
        <p class="project-update-label" data-i18n="systemStatus.title">システム状況</p>
        <div class="system-status-live" role="status" aria-live="polite" aria-atomic="true" data-system-status-surface="home">
          <h2 id="systemStatusTitle" class="system-status-overall" data-i18n="systemStatus.checking">システム状況を確認しています……</h2>
        </div>
      </article>
    </section>

    <section class="daily-inspiration-section website-version-section fade-in fade-in-delay-2" aria-labelledby="websiteVersionTitle">
      <article class="apod-card">
        <div class="apod-content">
          <p class="apod-label">Website Version</p>
          <div class="version-heading">
            <h2 id="websiteVersionTitle">v1.6.4</h2>
            <span class="version-badge">Stable release</span>
          </div>

          <div class="apod-date release-notes">
            <p>Release notes:</p>
            <ul>
              <li>Contact API のレスポンスに Cache-Control: no-store を設定しました。</li>
              <li>Contact のレスポンスがキャッシュされることを防ぎます。</li>
              <li>関連するユニットテストと API 契約テストのカバレッジを追加しました。</li>
            </ul>
          </div>
        </div>
      </article>
    </section>

    <section class="tech-news-section fade-in fade-in-delay-1" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle" data-i18n="home.tech.title"></h2>
        <p data-i18n="home.tech.desc"></p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading tech-news-status" role="status" aria-live="polite" aria-atomic="true" data-tech-news-state="loading">最新情報を読み込み中...</p>
      </div>
    </section>

    <section class="tech-news-section infrastructure-status-section fade-in fade-in-delay-2" aria-labelledby="infrastructureStatusTitle">
      <div class="tech-news-header infrastructure-status-header">
        <h2 id="infrastructureStatusTitle" data-i18n="home.infrastructure.title"></h2>
        <p data-i18n="home.infrastructure.desc"></p>
      </div>

      <div id="infrastructureStatusCards" class="infrastructure-status-grid">
        <p class="infrastructure-status-message" role="status" aria-live="polite" aria-atomic="true" data-infrastructure-status-state="loading" data-i18n="home.infrastructure.loading"></p>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/home-cards.js"></script>
  <script src="/js/glass-material.js"></script>
  <script src="/js/mobile-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>

</body>
</html>
