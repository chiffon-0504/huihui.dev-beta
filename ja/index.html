<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4>開発者 / 写真</h4>
        <div class="hero-actions">
          <a href="/ja/about/" class="hero-btn">私について</a>
          <a href="/ja/contact/" class="hero-btn">連絡先</a>
        </div>
      </div>

      <div class="home-image">
        <img src="/images/0001_hp.webp" alt="ホームページ写真" />
      </div>
    </section>

    <section class="daily-inspiration-section" aria-labelledby="apodTitle">
      <article class="apod-card">
        <a
          class="apod-media-link"
          id="apod-link"
          href="https://apod.nasa.gov/apod/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            id="apod-image"
            class="apod-image"
            src="/images/0001_hp.webp"
            alt="NASA APOD"
            loading="lazy"
          />
        </a>

        <div class="apod-content">
          <p class="apod-label">Daily Inspiration</p>
          <h2 id="apodTitle">NASA APOD 読み込み中...</h2>
          <p id="apod-desc">天文画像を取得しています。</p>
          <p id="apod-date" class="apod-date"></p>
        </div>
      </article>
    </section>

    <section class="tech-news-section" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle">テックニュース</h2>
        <p>AI・iOS・Android の最新情報を表示します。</p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">読み込み中...</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="プレビュー" />
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/lightbox.js"></script>

</body>
</html>
