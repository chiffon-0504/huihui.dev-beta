<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <title>作品 | huihui.dev</title>
</head>

<body>

  <main class="main">

    <section id="works">
      <div class="works-grid">
        <article class="work-card large"><img src="/images/2002_w.webp" alt="通天閣" class="zoomable" /></article>
        <article class="work-card tall"><img src="/images/2003_w.webp" alt="横浜港" class="zoomable" /></article>

      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="プレビュー" />

  <script src="/js/layout.js"></script>
  <script src="/js/lightbox.js"></script>
