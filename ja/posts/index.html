<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投稿 | huihui.dev</title>
  <link rel="stylesheet" href="/style.css?v=2" />

<body>
  <aside id="site-sidebar" class="sidebar"></aside>

      <div class="post-content">
KYOREN ROMANCE <span class="future">FUTURE 10+</span> <span class="ex">EX</span> !!!

<a class="hashtag" href="https://x.com/hashtag/arcaea?src=hashtag_click" target="_blank" rel="noopener noreferrer">#arcaea</a>
      </div>

      <figure class="post-figure">
        <div class="post-image">
          <img src="/images/3004_p.webp" data-i18n-alt="posts.scoreAlt" class="zoomable" />
        </div>
        <figcaption class="post-caption">Arcaea images and properties belong to © lowiro.</figcaption>
      </figure>
    </article>

    <!-- others same pattern -->
  </main>

  <div class="lightbox" id="lightbox">

    <img class="lightbox-img" id="lightboxImg" src="" data-i18n-alt="posts.preview" />

  <script src="/js/layout.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/locales/zh.js"></script>
