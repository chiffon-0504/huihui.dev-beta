<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連絡先 | huihui.dev</title>
  <link rel="stylesheet" href="/css/contact.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell">
      <div class="contact-page">
        <div class="page-body contact-content">
          <h1 data-i18n="contact.title"></h1>
          <p class="contact-intro" data-i18n="contact.intro"></p>

          <form id="contact-form" class="contact-form" action="https://api.huihui.dev/api/contact" method="POST">
            <div class="contact-field-grid">
              <label>
                <span data-i18n="contact.name"></span>
                <input type="text" name="name" data-i18n-placeholder="contact.namePlaceholder" autocomplete="name" required>
              </label>

              <label>
                <span data-i18n="contact.email"></span>
                <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
              </label>
            </div>

            <label>
              <span data-i18n="contact.message"></span>
              <textarea name="message" rows="7" data-i18n-placeholder="contact.messagePlaceholder" required></textarea>
            </label>

            <div
              class="cf-turnstile"
              data-sitekey="0x4AAAAAADGNDJDS7_lhuZCV"
              data-action="contact"
            ></div>

            <button type="submit" data-i18n="contact.submit"></button>
            <p id="contact-status" class="contact-status" aria-live="polite"></p>
          </form>

          <p class="contact-fallback">
            <span data-i18n="contact.fallbackPrefix"></span> <a href="mailto:contact@huihui.dev">contact@huihui.dev</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/code-blocks.js"></script>
  <script src="/js/home-cards.js"></script>
  <script src="/js/glass-material.js"></script>
  <script src="/js/mobile-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/locales/zh.js"></script>
  <script src="/js/locales/en.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
