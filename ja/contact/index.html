<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <title>連絡先 | huihui.dev</title>
  <link rel="canonical" href="https://huihui.dev/ja/contact/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://huihui.dev/contact/" />
  <link rel="alternate" hreflang="en" href="https://huihui.dev/en/contact/" />
  <link rel="alternate" hreflang="ja" href="https://huihui.dev/ja/contact/" />
  <link rel="alternate" hreflang="x-default" href="https://huihui.dev/contact/" />
  <link rel="stylesheet" href="/css/contact.css">
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell">
      <div class="contact-page">
        <div class="page-body contact-content">
          <h1 data-i18n="contact.title"></h1>

          <form id="contact-form" class="contact-form" action="https://api.huihui.dev/api/contact" method="POST">
            <div class="contact-field-grid">
              <label>
                <span data-i18n="contact.name"></span>
                <input type="text" name="name" data-i18n-placeholder="contact.namePlaceholder" autocomplete="name" required>
              </label>

              <label>
                <span data-i18n="contact.email"></span>
                <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
              </label>
            </div>

            <label>
              <span data-i18n="contact.subject"></span>
              <input type="text" name="subject" data-i18n-placeholder="contact.subjectPlaceholder" autocomplete="off" required>
            </label>

            <label>
              <span data-i18n="contact.message"></span>
              <textarea name="message" rows="7" data-i18n-placeholder="contact.messagePlaceholder" required></textarea>
            </label>

            <div
              class="cf-turnstile"
              data-sitekey="0x4AAAAAADGNDJDS7_lhuZCV"
              data-action="contact"
            ></div>

            <button type="submit" data-i18n="contact.submit"></button>
            <p id="contact-status" class="contact-status" aria-live="polite"></p>
          </form>

          <p class="contact-fallback">
            <span data-i18n="contact.fallbackPrefix"></span> <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=contact%40huihui.dev" target="_blank" rel="noopener noreferrer">contact@huihui.dev</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/glass-material.js"></script>
  <script src="/js/mobile-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/locales/ja.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
