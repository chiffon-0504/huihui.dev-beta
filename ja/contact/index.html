<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連絡先 | huihui.dev</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="contact-page">
      <div class="contact-content">
        <p class="contact-eyebrow">Contact</p>
        <h1>連絡先</h1>
        <p class="contact-intro">ご質問、コラボレーション、フィードバックなどは、下のフォームからご連絡ください。</p>

        <form class="contact-form" action="https://api.huihui.dev/api/contact" method="POST">
          <div class="contact-field-grid">
            <label>
              名前
              <input type="text" name="name" placeholder="お名前" autocomplete="name" required>
            </label>

            <label>
              Email
              <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
            </label>
          </div>

          <label>
            メッセージ
            <textarea name="message" rows="7" placeholder="メッセージ内容" required></textarea>
          </label>

          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAADGNDJDS7_lhuZCV"
          ></div>

          <button type="submit">送信する</button>
        </form>

        <p class="contact-fallback">
          直接メールする場合：<a href="mailto:contact@huihui.dev">contact@huihui.dev</a>
        </p>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
</body>
</html>
