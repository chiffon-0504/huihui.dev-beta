<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4>開發者 / 攝影</h4>
        <div class="hero-actions">
          <a href="/about/" class="hero-btn">關於</a>
          <a href="/contact/" class="hero-btn">聯絡</a>
        </div>
      </div>

      <div class="home-image">
        <img src="images/0001_hp.webp" alt="首頁照片" />
      </div>
    </section>

    <section class="tech-news-section" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle">科技動態</h2>
        <p>每日整理 AI、iOS 與 Android 的最新消息。</p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">正在載入最新消息...</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </div>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>

</body>
</html>
