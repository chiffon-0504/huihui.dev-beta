<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero fade-in">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4 data-i18n="home.hero.subtitle"></h4>
        <div class="hero-actions">
          <a href="/about/" class="hero-btn" data-i18n="home.hero.about"></a>
          <a href="/contact/" class="hero-btn" data-i18n="home.hero.contact"></a>
        </div>
      </div>

      <article class="project-update-card" aria-labelledby="projectUpdateTitle">
        <p class="project-update-label" data-i18n="home.projectUpdate.label"></p>
        <h2 id="projectUpdateTitle">新增 Steam API 遊戲展示</h2>
        <p class="project-update-desc">關於我頁面已接入 Steam API，顯示自訂 Galgame 遊戲卡片。</p>
        <a
          id="projectUpdateLink"
          class="project-update-meta"
          href="https://github.com/chiffon-0504/huihui_project-v1"
          target="_blank"
          rel="noopener noreferrer"
        >
          huihui_project-v1 · Loading...
        </a>
      </article>
    </section>

    <section class="daily-inspiration-section fade-in fade-in-delay-2" aria-labelledby="apodTitle">
      <article class="apod-card">
        <a
          class="apod-media-link"
          id="apod-link"
          href="https://apod.nasa.gov/apod/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            id="apod-image"
            class="apod-image"
            src="images/0001_hp.webp"
            alt="NASA Astronomy Picture of the Day"
            loading="lazy"
          />
        </a>

        <div class="apod-content">
          <p class="apod-label">Daily Inspiration</p>
          <h2 id="apodTitle">Loading NASA APOD...</h2>
          <p id="apod-desc">Fetching today's astronomy image.</p>
          <p id="apod-date" class="apod-date"></p>
        </div>
      </article>
    </section>

    <section class="tech-news-section fade-in fade-in-delay-1" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle" data-i18n="home.tech.title"></h2>
        <p data-i18n="home.tech.desc"></p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">正在載入最新消息...</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </div>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/locales/zh.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/ja.js"></script>
  <script src="js/i18n.js"></script>

</body>
</html>
