<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <h1><a href="/">huihui.dev</a></h1>
      <nav>
        <a href="/about/">關於我</a>
        <a href="/works/">作品</a>
        <a href="/posts/">貼文</a>
        <a href="/contact/">聯絡</a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      © 2026 huihui.dev<br />
      All rights reserved.
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <section class="home-hero">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4>Developer / Photography</h4>
        <div class="hero-actions">
          <a href="/about/" class="hero-btn">About</a>
          <a href="/contact/" class="hero-btn">Contact</a>
        </div>
      </div>

      <div class="home-image">
        <!-- 這張現在會可以點擊放大 -->
        <img src="images/0001_hp.webp" alt="首頁照片" />
      </div>
    </section>
  </main>

  <!-- 🔥 Lightbox（一定要有） -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </div>

  <!-- 🔥 JS（首頁用這個路徑） -->
  <script src="js/lightbox.js"></script>

</body>
</html>
