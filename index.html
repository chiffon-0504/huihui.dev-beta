<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>huihui.dev</title>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <h1><a href="/">huihui.dev</a></h1>

      <div class="lang-switch" aria-label="Language switch">
        <a href="/" class="active">中</a>
        <span>|</span>
        <a href="/en/">English</a>
        <span>|</span>
        <a href="/ja/">日本語</a>
      </div>

      <nav>
        <a href="/about/">關於我</a>
        <a href="/works/">作品</a>
        <a href="/posts/">貼文</a>
        <a href="/contact/">聯絡</a>
        <a href="/tools/tier-maker/" class="tools-link">
          工具
          <span class="beta-badge" aria-label="Beta">Beta</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      © 2026 huihui.dev<br />
      All rights reserved.
    </div>
  </aside>

  <main class="main">
    <section class="home-hero">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <h4>開發者 / 攝影</h4>
        <div class="hero-actions">
          <a href="/about/" class="hero-btn">關於</a>
          <a href="/contact/" class="hero-btn">聯絡</a>
        </div>
      </div>

      <div class="home-image">
        <img src="images/0001_hp.webp" alt="首頁照片" />
      </div>
    </section>

    <section class="tech-news-section" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle">Tech Updates</h2>
        <p>Daily signals from AI, iOS and Android.</p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">Loading updates...</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </div>

  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>

</body>
</html>
