<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>huihui.dev</title>
  <link rel="canonical" href="https://huihui.dev/" />
  <link rel="alternate" hreflang="zh-Hant" href="https://huihui.dev/" />
  <link rel="alternate" hreflang="en" href="https://huihui.dev/en/" />
  <link rel="alternate" hreflang="ja" href="https://huihui.dev/ja/" />
  <link rel="alternate" hreflang="x-default" href="https://huihui.dev/" />
</head>

<body>

  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="home-hero fade-in">
      <div class="home-text">
        <h1>huihui.dev</h1>
        <p class="home-subtitle" data-i18n="home.hero.subtitle"></p>
        <div class="hero-actions">
          <a href="/about/" class="hero-btn" data-i18n="home.hero.about"></a>
          <a href="/contact/" class="hero-btn" data-i18n="home.hero.contact"></a>
        </div>
      </div>

      <article class="project-update-card" aria-labelledby="projectUpdateTitle">
        <p class="project-update-label" data-i18n="home.projectUpdate.label"></p>
        <h2 id="projectUpdateTitle" data-i18n="home.projectUpdate.title"></h2>
        <p class="project-update-desc" data-i18n="home.projectUpdate.desc"></p>
      </article>
    </section>

    <section class="daily-inspiration-section website-version-section fade-in fade-in-delay-2" aria-labelledby="websiteVersionTitle">
      <article class="apod-card">
        <div class="apod-content">
          <p class="apod-label">Website Version</p>
          <div class="version-heading">
            <h2 id="websiteVersionTitle">v1.3.0</h2>
            <span class="version-badge">Release candidate</span>
          </div>

          <div class="apod-date release-notes">
            <p>Release notes:</p>
            <ul>
              <li>強化 Contact 來源驗證、Turnstile 綁定與外部依賴完整性</li>
              <li>為外部 API 加入逾時控制與可靠的失敗回復</li>
              <li>改善 About、Works 與 Milestones 圖片載入與版面穩定性</li>
              <li>完善三語 SEO、可及性與錯誤頁語言標記</li>
              <li>新增 Firefox／WebKit 關鍵流程測試並提升行動版選單焦點穩定性</li>
            </ul>
          </div>
        </div>
      </article>
    </section>

    <section class="tech-news-section fade-in fade-in-delay-1" aria-labelledby="techNewsTitle">
      <div class="tech-news-header">
        <h2 id="techNewsTitle" data-i18n="home.tech.title"></h2>
        <p data-i18n="home.tech.desc"></p>
      </div>

      <div id="techNewsCards" class="tech-news-grid">
        <p class="tech-news-loading">正在載入最新消息...</p>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="放大預覽">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="關閉預覽">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </dialog>

  <script src="js/layout.js"></script>
  <script src="js/code-blocks.js"></script>
  <script src="js/home-cards.js"></script>
  <script src="js/glass-material.js"></script>
  <script src="js/mobile-drawer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/locales/zh.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/ja.js"></script>
  <script src="js/i18n.js"></script>

</body>
</html>
