<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分級表製作器 | huihui.dev</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
  
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell tier-maker-page">
      <header class="page-header tier-header">
        <div class="tier-title-row">
          <h1 data-i18n="tierMaker.title"></h1>
          <button type="button" id="saveBtn" class="save-button" data-i18n="tierMaker.save"></button>
        </div>
        <p data-i18n="tierMaker.intro"></p>
      </header>

      <div class="page-body">
        <section class="tier-toolbar" aria-label="Tier Maker controls" data-i18n-aria-label="tierMaker.toolbarLabel">
          <button type="button" id="addTierBtn" data-i18n="tierMaker.addTier"></button>
          <label class="upload-button">
            <span data-i18n="tierMaker.upload"></span>
            <input type="file" id="imageUpload" accept="image/*" multiple hidden>
          </label>
          <label class="size-control">
            <span data-i18n="tierMaker.imageSize"></span>
            <input type="range" id="sizeSlider" min="80" max="220" value="150">
          </label>
        </section>

        <section class="tier-board" id="tierBoard">
          <div class="tier-row">
            <div class="tier-label-wrap" style="background:#ff7f7f">
              <input class="tier-label" value="S" aria-label="Tier name" data-i18n-aria-label="tierMaker.tierName">
              <input class="tier-color" type="color" value="#ff7f7f" aria-label="Tier color" data-i18n-aria-label="tierMaker.tierColor">
            </div>
            <div class="tier-content" aria-label="S 等級"></div>
            <button type="button" class="delete-tier" aria-label="Delete tier" data-i18n-aria-label="tierMaker.deleteTier">×</button>
          </div>
          <div class="tier-row">
            <div class="tier-label-wrap" style="background:#ffc07f">
              <input class="tier-label" value="A" aria-label="Tier name" data-i18n-aria-label="tierMaker.tierName">
              <input class="tier-color" type="color" value="#ffc07f" aria-label="Tier color" data-i18n-aria-label="tierMaker.tierColor">
            </div>
            <div class="tier-content" aria-label="A 等級"></div>
            <button type="button" class="delete-tier" aria-label="Delete tier" data-i18n-aria-label="tierMaker.deleteTier">×</button>
          </div>
          <div class="tier-row">
            <div class="tier-label-wrap" style="background:#ffff7f">
              <input class="tier-label" value="B" aria-label="Tier name" data-i18n-aria-label="tierMaker.tierName">
              <input class="tier-color" type="color" value="#ffff7f" aria-label="Tier color" data-i18n-aria-label="tierMaker.tierColor">
            </div>
            <div class="tier-content" aria-label="B 等級"></div>
            <button type="button" class="delete-tier" aria-label="Delete tier" data-i18n-aria-label="tierMaker.deleteTier">×</button>
          </div>
        </section>

        <section class="image-pool">
          <h2 data-i18n="tierMaker.pool"></h2>
          <div class="pool-content" id="poolContent"></div>
        </section>

        <p class="tier-note" data-i18n="tierMaker.note"></p>
      </div>
    </section>
  </main>

  <script src="../../js/locales/zh.js"></script>
  <script src="../../js/locales/en.js"></script>
  <script src="../../js/locales/ja.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/code-blocks.js"></script>
  <script src="../../js/home-cards.js"></script>
  <script src="../../js/glass-material.js"></script>
  <script src="../../js/mobile-drawer.js"></script>
  <script src="../../js/main.js"></script>
  <script src="script.js"></script>
  <script src="/js/layout.js"></script>
</body>
</html>
