<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>114514 | huihui.dev</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
    }

    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      box-sizing: border-box;
    }

    .error-card {
      width: min(100%, 720px);
      padding: clamp(34px, 7vw, 72px);
      border: 1px solid rgba(107, 132, 164, 0.32);
      border-radius: 28px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.76),
          rgba(230, 244, 255, 0.62)
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 24px 80px rgba(80, 140, 210, 0.18),
        0 12px 32px rgba(31, 53, 82, 0.12);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      text-align: center;
    }

    .error-page h1 {
      margin: 0 0 1.25rem;
      color: #0f2238 !important;
      -webkit-text-fill-color: #0f2238 !important;
      font-size: clamp(4rem, 16vw, 8rem);
      font-weight: 800;
      line-height: 0.95;
      opacity: 1 !important;
      text-shadow: none !important;
    }

    .error-page p {
      margin: 0.4rem 0;
      color: #172b42 !important;
      -webkit-text-fill-color: #172b42 !important;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      font-weight: 600;
      line-height: 1.65;
      opacity: 1 !important;
      text-shadow: none !important;
    }

    .error-home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 52px;
      margin-top: 2rem;
      padding: 0 2rem;

      border: 1px solid rgba(80, 94, 112, 0.55);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);

      color: #111827 !important;
      -webkit-text-fill-color: #111827 !important;
      text-decoration: none;

      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      opacity: 1 !important;
      text-shadow: none !important;

      box-shadow:
        0 0 0 6px rgba(90, 105, 125, 0.14),
        0 16px 38px rgba(31, 53, 82, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .error-home-button:hover,
    .error-home-button:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 0 0 8px rgba(90, 105, 125, 0.2),
        0 22px 48px rgba(31, 53, 82, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .error-home-button:focus-visible {
      outline: 3px solid rgba(31, 53, 82, 0.22);
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      .error-card {
        padding: 2.5rem 1.25rem;
      }

      .error-home-button {
        width: 100%;
        padding: 0 1.25rem;
      }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="errorTitle">
      <h1 id="errorTitle">114514</h1>

      <p>這個頁面太過惡臭了。</p>
      <p lang="en">This page is far too foul.</p>
      <p lang="ja">このページはあまりにも臭すぎます。</p>

      <a class="error-home-button" href="/">回首頁 / <span lang="en">Home</span> / <span lang="ja">ホーム</span></a>
    </section>
  </main>
</body>
</html>
