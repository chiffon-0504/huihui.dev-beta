<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>里程碑 | huihui.dev</title>
  <link rel="stylesheet" href="/css/posts.css" />
  <link rel="stylesheet" href="/style.css?v=drawer" />
</head>
<body>
  <aside id="site-sidebar" class="sidebar"></aside>

  <main class="main">
    <section class="page-shell">
      <header class="page-header posts-header">
        <h1 data-i18n="posts.title"></h1>
        <p data-i18n="posts.intro"></p>
      </header>

      <div class="page-body">
        <section id="postsList"></section>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="放大預覽">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="關閉預覽">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="放大預覽" />
  </dialog>

  <script src="../js/layout.js"></script>
  <script src="../js/code-blocks.js"></script>
  <script src="../js/home-cards.js"></script>
  <script src="../js/glass-material.js"></script>
  <script src="../js/mobile-drawer.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/lightbox.js"></script>
  <script src="../js/posts-data.js"></script>
  <script src="../js/posts-render.js"></script>
  <script src="../js/locales/zh.js"></script>
  <script src="../js/locales/en.js"></script>
  <script src="../js/locales/ja.js"></script>
  <script src="../js/i18n.js"></script>
</body>
</html>
