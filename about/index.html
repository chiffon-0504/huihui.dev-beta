<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>關於我 | huihui.dev</title>

  <link rel="stylesheet" href="../style.css" />

  <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/prismjs/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

  <style>
    .about-page {
      max-width: 840px;
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: flex-start;
      padding: 56px 0;
    }

    .about-content {
      width: 100%;
    }

    .interest-cards {
      display: grid;
      gap: 34px;
    }

    .interest-card {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      align-items: start;
      gap: 26px;
      padding: 8px 0;
    }

    .interest-card h4 {
      margin: 0;
      font-size: clamp(1.5rem, 2.8vw, 2.2rem);
      font-weight: 700;
    }

    .interest-gallery img {
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      display: block;
    }

    @media (max-width: 900px) {
      .main { margin-left: 0; }
      .interest-card { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="main">
    <section class="about-page">
      <div class="about-content">
        <h1>關於我</h1>

        <section>
          <h2>興趣</h2>

          <div class="interest-cards">
            <article class="interest-card">
              <h4>maimai DX</h4>
              <div class="interest-gallery">
                <img src="../images/1001_aa.webp" alt="maimai DX" />
              </div>
            </article>

            <article class="interest-card">
              <h4>Arcaea</h4>
              <div class="interest-gallery">
                <img src="../images/1002_aa.webp" alt="Arcaea" />
              </div>
            </article>

            <article class="interest-card">
              <h4>Galgame</h4>
              <div class="interest-gallery">
                <img src="../images/1003_aa.webp" alt="Galgame" />
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
