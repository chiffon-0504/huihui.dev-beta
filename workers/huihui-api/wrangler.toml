name = "huihui-api"
main = "worker.js"
compatibility_date = "2026-05-04"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
WORKER_ENV = "production"
# Optional public non-secret URL: BETTER_STACK_STATUS_PAGE_JSON_URL.
# Set the real published HTTPS /index.json URL here when supplied; no invented default.

[env.beta]
name = "huihui-api-beta"
workers_dev = true

[env.beta.vars]
WORKER_ENV = "beta"
# BETTER_STACK_STATUS_PAGE_JSON_URL must be set separately here for beta.
# It uses the same production monitors, never beta Website/API/Contact monitors.

[env.beta.observability]
enabled = true
head_sampling_rate = 1

[env.beta.observability.logs]
invocation_logs = false

# Secrets / variables should be configured in Cloudflare Dashboard or via Wrangler.
# Do not commit real API keys to GitHub.
# Required bindings used by worker.js:
# STEAM_API_KEY
# STEAM_ID
# TURNSTILE_SECRET_KEY
# FORMSPREE_ENDPOINT
# Optional binding (the Worker falls back to DEMO_KEY):
# NASA_API_KEY
